# Spring Boot TLS overlay for the Authorization Server (server-side HTTPS only).
# Pair with PEM files generated by scripts/generate-tls-certs.sh
#
# Example:
#   java -jar target/rose-authorization-server.jar \
#     --config=configs/config.yml \
#     --spring.config.additional-location=optional:file:configs/tls/application-tls.yml

spring:
  ssl:
    bundle:
      pem:
        server:
          keystore:
            certificate: configs/tls/certs/server.crt
            private-key: configs/tls/certs/server.key

server:
  ssl:
    bundle: server
    client-auth: NONE
