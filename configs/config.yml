rose:
  authorization-server:
    users:
      - username: alice
        password: alice
        attributes:
          email: alice@example.com
          roles:
            - viewer
            - editor
            - admin
      - username: bob
        password: bob
        attributes:
          email: bob@example.com
          roles:
            - viewer
            - editor
    # Optional: override default client. redirect-uris must match your OAuth2 client app.
    clients:
      - client-id: default-client-id
        client-secret: default-client-secret
        client-authentication-methods:
          - client_secret_basic
          - client_secret_post
          - none
        authorization-grant-types:
          - authorization_code
          - refresh_token
          - client_credentials
          - urn:ietf:params:oauth:grant-type:token-exchange
        scope:
          - openid
          - email
          - profile
        redirect-uris:
          - http://localhost:8080
          - http://localhost:8080/login/oauth2/code/rose-authorization-server
          - http://127.0.0.1:8080/login/oauth2/code/rose-authorization-server
        require-authorization-consent: false
        require-proof-key: false
        validate-redirect-uri: false
        validate-scope: false
