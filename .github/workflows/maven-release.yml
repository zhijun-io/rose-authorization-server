name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.1.0)'
        required: true
        type: string
      next-version:
        description: 'Next development version after the release (e.g., 0.1.1-SNAPSHOT). Empty to skip the bump.'
        required: false
        type: string
      skip_tests:
        description: 'Skip tests (use for hotfixes only)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Default to least privilege; the release job raises it to write below.
permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: zhijun-io/github-workflows/.github/workflows/maven-release.yml@main
    with:
      version: ${{ inputs.version }}
      next-version: ${{ inputs.next-version }}
      java-version: '17'
      skip-tests: ${{ inputs.skip_tests || false }}
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
